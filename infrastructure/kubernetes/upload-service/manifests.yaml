apiVersion: v1
kind: ConfigMap
metadata:
  name: upload-service-config
  namespace: tdse
data:
  ENVIRONMENT: "production"
  JWT_ALGORITHM: "HS256"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "tdse-production-handwriting-images"
  S3_ENDPOINT_URL: ""
  KAFKA_BOOTSTRAP_SERVERS: "b-1.tdse-msk.example:9094,b-2.tdse-msk.example:9094"
  KAFKA_SECURITY_PROTOCOL: "SSL"
  KAFKA_TOPIC_IMAGE_UPLOADED: "image-uploaded"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: upload-service-secrets
  namespace: tdse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: upload-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: /tdse/production/jwt-secret-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
  namespace: tdse
  labels:
    app: upload-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
    spec:
      serviceAccountName: tdse-service-account
      nodeSelector:
        node-type: cpu
      containers:
        - name: upload-service
          image: <aws-account-id>.dkr.ecr.us-east-1.amazonaws.com/tdse/upload-service:v1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: upload-service-config
            - secretRef:
                name: upload-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: upload-service
  namespace: tdse
spec:
  type: ClusterIP
  selector:
    app: upload-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: upload-service
  namespace: tdse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: upload-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
