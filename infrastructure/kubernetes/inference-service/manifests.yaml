apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-service-config
  namespace: tdse
data:
  ENVIRONMENT: "production"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "tdse-production-handwriting-images"
  S3_ENDPOINT_URL: ""
  DYNAMODB_TABLE_NAME: "inference-results"
  DYNAMODB_ENDPOINT_URL: ""
  MODEL_PATH: "/app/models/emotion_model.pt"
  DEVICE: "cuda"
  USE_DUMMY_MODEL_IF_MISSING: "false"
  KAFKA_BOOTSTRAP_SERVERS: "b-1.tdse-msk.example:9094,b-2.tdse-msk.example:9094"
  KAFKA_SECURITY_PROTOCOL: "SSL"
  KAFKA_TOPIC_IMAGE_PREPROCESSED: "image-preprocessed"
  KAFKA_GROUP_ID: "inference-group"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: inference-service-secrets
  namespace: tdse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: inference-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: /tdse/production/jwt-secret-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: tdse
  labels:
    app: inference-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
    spec:
      serviceAccountName: tdse-service-account
      nodeSelector:
        node-type: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: inference-service
          image: <aws-account-id>.dkr.ecr.us-east-1.amazonaws.com/tdse/inference-service:v1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: inference-service-config
            - secretRef:
                name: inference-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-volume
              mountPath: /app/models
              readOnly: true
      volumes:
        - name: model-volume
          persistentVolumeClaim:
            claimName: tdse-model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: inference-service
  namespace: tdse
spec:
  type: ClusterIP
  selector:
    app: inference-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-service
  namespace: tdse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-service
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
