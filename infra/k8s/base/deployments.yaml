apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: tdse
  labels:
    app.kubernetes.io/name: inference-service
    app.kubernetes.io/part-of: tdse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-service
        app.kubernetes.io/part-of: tdse
    spec:
      serviceAccountName: tdse-service-account
      nodeSelector:
        tdse/node-pool: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: inference-service
          image: <aws-account-id>.dkr.ecr.us-east-1.amazonaws.com/tdse-inference-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: tdse-secrets
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tdse-secrets
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: tdse-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-volume
              mountPath: /app/models
              readOnly: true
      volumes:
        - name: model-volume
          persistentVolumeClaim:
            claimName: tdse-model-pvc
---
