apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: tdse
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: tdse
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: tdse
    spec:
      serviceAccountName: tdse-service-account
      nodeSelector:
        tdse/node-pool: cpu
      containers:
        - name: auth-service
          image: <aws-account-id>.dkr.ecr.us-east-1.amazonaws.com/tdse-auth-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tdse-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tdse-secrets
                  key: JWT_SECRET_KEY
          envFrom:
            - configMapRef:
                name: tdse-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
