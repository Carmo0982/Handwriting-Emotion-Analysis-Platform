name: Reusable — Service tests

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: "3.11"

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: services/${{ inputs.service_name }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ inputs.service_name }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        working-directory: services/${{ inputs.service_name }}
        run: |
          pytest tests \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
          coverage report --format=markdown > coverage.md || coverage report > coverage.md

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.service_name }}
          path: services/${{ inputs.service_name }}/coverage.*

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-${{ inputs.service_name }}
          path: services/${{ inputs.service_name }}/coverage.md
