name: CI — Tests y validación

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-auth-service:
    uses: ./.github/workflows/reusable-test.yml
    with:
      service_name: auth-service
      python_version: "3.11"

  test-upload-service:
    uses: ./.github/workflows/reusable-test.yml
    with:
      service_name: upload-service
      python_version: "3.11"

  test-preprocessing-service:
    uses: ./.github/workflows/reusable-test.yml
    with:
      service_name: preprocessing-service
      python_version: "3.11"

  test-results-service:
    uses: ./.github/workflows/reusable-test.yml
    with:
      service_name: results-service
      python_version: "3.11"

  test-ml-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt pytest pytest-cov

      - name: Run ML tests
        run: |
          pytest ml/tests --cov=ml --cov-report=term-missing --cov-report=xml:ml-coverage.xml

      - name: Verify forward pass
        run: |
          python - <<'PY'
          import torch
          from ml.model.architecture import EmotionClassifier

          model = EmotionClassifier(num_classes=4, pretrained=False).eval()
          with torch.no_grad():
              output = model(torch.rand(1, 3, 224, 224))
          assert output.shape == (1, 4)
          PY

      - name: Upload ML coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ml
          path: ml-coverage.xml

  test-inference-service:
    needs: test-ml-model
    uses: ./.github/workflows/reusable-test.yml
    with:
      service_name: inference-service
      python_version: "3.11"

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy

      - name: Run flake8
        run: |
          flake8 services ml tests --max-line-length=100 --extend-ignore=E203,W503

      - name: Run black check
        run: |
          black --check services ml tests

      - name: Run mypy
        run: |
          for service in services/*-service; do
            if [ -d "$service/app" ]; then
              (cd "$service" && python -m mypy --ignore-missing-imports --follow-imports=silent app)
            fi
          done
          python -m mypy --ignore-missing-imports --follow-imports=silent ml

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit "safety<3"

      - name: Run Bandit
        run: |
          bandit -r services ml -ll

      - name: Run Safety
        run: |
          for req in services/*-service/requirements.txt ml/requirements.txt; do
            echo "Checking $req"
            safety check -r "$req" --full-report
          done
