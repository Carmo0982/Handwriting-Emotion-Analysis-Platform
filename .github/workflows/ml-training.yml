name: ML — Entrenamiento del modelo

on:
  workflow_dispatch:
    inputs:
      dataset_s3_path:
        description: S3 path containing class folders for training
        required: true
        type: string
      epochs:
        description: Number of epochs
        required: true
        default: "50"
        type: string
      k_folds:
        description: Number of folds
        required: true
        default: "5"
        type: string

permissions:
  contents: read

env:
  MODEL_BUCKET: tdse-models
  MODEL_S3_URI: s3://tdse-models/emotion_model_sha-${{ github.sha }}.pt

jobs:
  train:
    runs-on: ubuntu-latest
    outputs:
      model_s3_uri: ${{ steps.evaluate.outputs.model_s3_uri }}
      mean_f1: ${{ steps.evaluate.outputs.mean_f1 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download dataset
        run: |
          mkdir -p data/training
          aws s3 sync "${{ inputs.dataset_s3_path }}" data/training

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Train model
        run: |
          python -m ml.training.train \
            --data-dir data/training \
            --epochs "${{ inputs.epochs }}" \
            --k-folds "${{ inputs.k_folds }}" \
            --checkpoint-dir checkpoints \
            --metrics-output training_metrics.json

      - name: Evaluate training threshold
        id: evaluate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          metrics = json.loads(Path("training_metrics.json").read_text())
          mean_f1 = float(metrics["mean_f1_macro"])
          best_fold = max(metrics["folds"], key=lambda fold: float(fold["best_f1_macro"]))
          print(f"mean_f1={mean_f1}")
          print(f"best_checkpoint={best_fold['checkpoint_path']}")
          print("model_s3_uri=${{ env.MODEL_S3_URI }}")
          PY

      - name: Upload training metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-metrics
          path: training_metrics.json

      - name: Enforce F1 threshold
        run: |
          python - <<'PY'
          mean_f1 = float("${{ steps.evaluate.outputs.mean_f1 }}")
          if mean_f1 <= 0.70:
              raise SystemExit(f"Mean macro F1 {mean_f1:.4f} is below required threshold 0.70")
          PY

      - name: Upload model to S3
        run: |
          aws s3 cp "${{ steps.evaluate.outputs.best_checkpoint }}" "${MODEL_S3_URI}"

  update-model:
    needs: train
    runs-on: ubuntu-latest
    env:
      NAMESPACE: tdse

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Update inference model path
        run: |
          kubectl -n "$NAMESPACE" patch configmap inference-service-config \
            --type merge \
            -p '{"data":{"MODEL_PATH":"${{ needs.train.outputs.model_s3_uri }}"}}'
          kubectl -n "$NAMESPACE" rollout restart deployment/inference-service
          kubectl -n "$NAMESPACE" rollout status deployment/inference-service --timeout=300s

      - name: Verify inference health
        run: |
          kubectl -n "$NAMESPACE" run "health-inference-${GITHUB_RUN_ID}" \
            --rm -i --restart=Never \
            --image=curlimages/curl:8.8.0 \
            --command -- curl -fsS "http://inference-service/health"
